<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>小红书监控 · 笔记监控</title>
    <link rel="stylesheet" href="assets/styles.css?v=20260713-chart-caption">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="index.html">
          <span class="brand-mark">R</span>
          <span>
            <strong>Redbook Monitor</strong>
            <small>创作者数据看板</small>
          </span>
        </a>
        <nav class="nav-list">
          <a class="nav-item" href="index.html"><span>总览</span></a>
          <a class="nav-item active" href="notes.html" aria-current="page"><span>笔记监控</span></a>
          <a class="nav-item" href="trends.html"><span>趋势分析</span></a>
          <a class="nav-item" href="tasks.html"><span>采集任务</span></a>
          <a class="nav-item" href="settings.html"><span>账号配置</span></a>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1>笔记监控</h1>
            <p class="page-subtitle">同时查看多个账号的笔记数据，默认按发布时间倒序。</p>
          </div>
          <div class="topbar-actions">
            <div class="control-row primary-controls">
              <form class="date-range-control" data-date-range-form aria-label="统计时间区间">
                <label>
                  <span>开始</span>
                  <input type="date" data-date-range-start>
                </label>
                <label>
                  <span>结束</span>
                  <input type="date" data-date-range-end>
                </label>
                <button class="button secondary" type="submit">应用</button>
              </form>
              <label class="search-box">
                <span class="sr-only">搜索笔记标题</span>
                <input type="search" placeholder="搜索笔记标题" data-notes-search>
              </label>
              <button class="button primary" type="button" data-refresh>刷新数据</button>
            </div>
            <div class="control-row scope-row">
              <div class="scope-tabs" aria-label="账号视角">
                <button class="scope-chip active" type="button" data-scope="all" aria-pressed="true">全部账号</button>
              </div>
            </div>
          </div>
        </header>

        <section class="panel table-panel">
          <div class="panel-heading">
            <div>
              <h2>全部笔记</h2>
              <p data-notes-summary>正在读取本地 SQLite 真实笔记数据。</p>
            </div>
            <span class="tag">发布时间倒序</span>
          </div>

          <div class="table-wrap">
            <table>
              <caption class="sr-only">笔记监控数据，默认按发布时间倒序</caption>
              <thead>
                <tr>
                  <th>笔记标题</th>
                  <th>账号</th>
                  <th>发布时间</th>
                  <th title="最近采集时该笔记的当前累计阅读">当前阅读</th>
                  <th title="小红书笔记管理列表不提供单篇曝光">单篇曝光</th>
                  <th>当前点赞</th>
                  <th>当前收藏</th>
                  <th>当前评论</th>
                </tr>
              </thead>
              <tbody data-notes-table>
                <tr>
                  <td>
                    <strong>笔记数据加载中</strong>
                    <small>等待本地 API 返回真实笔记</small>
                  </td>
                  <td><span class="account-label">待同步</span></td>
                  <td>-</td>
                  <td>待采集 <span class="mini-delta muted">待采集</span></td>
                  <td>待采集 <span class="mini-delta muted">待采集</span></td>
                  <td>待采集</td>
                  <td>待采集</td>
                  <td>待采集</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="assets/app.js?v=20260713-quality"></script>
  </body>
</html>
