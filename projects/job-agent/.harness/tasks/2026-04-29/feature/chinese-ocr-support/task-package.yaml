  - "缺少 chi_sim 语言包时，错误信息能指导用户安装和设置 OCR_LANG"
  - "单元测试覆盖默认语言、环境变量覆盖、缺失语言包提示"
  - "README/演示文档同步中文 OCR 使用方式"
  - "项目原生测试、评测、真实样本 CLI 通过"
read_first:
  - "AGENTS.md"
  - "ARCHITECTURE.md"
  - ".harness/environment.yaml"
  - "app/utils/input_reader.py"
  - "tests/test_input_reader.py"
verification_commands:
  - ".venv/bin/python -m unittest discover -s tests"
  - ".venv/bin/python -m app.evaluate --manifest data/eval_cases/manifest.json --output-dir outputs/evaluations"
  - ".venv/bin/python -m py_compile web_app.py"
  - ".venv/bin/python -m app.main --jd data/my_jd.txt --resume data/my_resume.pdf --output outputs/my_report.md --json-output outputs/my_report.json"
  - "tesseract --list-langs"
git_strategy:
  branch: "harness/feature/chinese-ocr-support"
  create_or_switch_before_coding: false
  commit_policy: "当前目录不是 git 仓库，本任务不创建分支或提交"
  push_policy: "不自动 push"
