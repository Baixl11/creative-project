title: "补齐中文 OCR 支持"
status: "planned"
goal: "让 JD 截图 OCR 对中文更友好：默认优先中文+英文，缺少语言包时给出明确安装提示，并补充测试和文档。"
context: "图片 OCR 已存在于 app/utils/input_reader.py，但默认语言为 eng；本机 tesseract --list-langs 只显示 eng、osd、snum。"
constraints:
