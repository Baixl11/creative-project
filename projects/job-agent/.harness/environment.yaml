schema_version: "1.0"

project:
  name: "job-agent"
  kind: "python-ai-service"

source:
  generated_from: ".harness/bootstrap-plan.yaml"
  workspace_map: ".harness/workspace-map.yaml"
  project_profile: ".harness/project-profile.yaml"

runtime:
  package_manager: "pip"
  language_runtimes:
    - "Python 3.14.4 observed in local .venv"
  env_files:
    - ".env"
    - ".env.example"
  notes:
    - "Default mock mode runs without API key."
    - "Live LLM mode uses OpenAI-compatible chat/completions configuration from .env."
    - "PDF support requires pypdf; image OCR requires Pillow, pytesseract, and system Tesseract."
    - "Image OCR defaults to chi_sim+eng for Chinese JD screenshots, but still requires Chinese Tesseract language data."

commands:
  -
    name: "install"
    command: ".venv/bin/python -m pip install -r requirements.txt"
    category: "setup"
    working_dir: "."
    long_running: false
    purpose: "Install project dependencies for PDF/OCR/Web UI/harness plan validation."
    evidence: "README.md Quick start and requirements.txt"
  -
    name: "unit_tests"
    command: ".venv/bin/python -m unittest discover -s tests"
    category: "test"
    working_dir: "."
    long_running: false
    purpose: "Run all unit tests for parsers, matching, Agent workflow, Web UI helpers, and evaluation helpers."
    evidence: "README.md Run the baseline tests"
  -
    name: "evaluation_suite"
    command: ".venv/bin/python -m app.evaluate --manifest data/eval_cases/manifest.json --output-dir outputs/evaluations"
    category: "evaluation"
    working_dir: "."
    long_running: false
    purpose: "Run high/medium/low match regression cases and write evaluation summaries."
    evidence: "README.md Run the evaluation suite"
  -
    name: "real_sample_cli"
    command: ".venv/bin/python -m app.main --jd data/my_jd.txt --resume data/my_resume.pdf --output outputs/my_report.md --json-output outputs/my_report.json"
    category: "runtime"
    working_dir: "."
    long_running: false
    purpose: "Run the current private Chinese JD/PDF resume sample locally."
    evidence: "DEMO_GUIDE.md and prior validated CLI runs"
  -
    name: "web_compile"
    command: ".venv/bin/python -m py_compile web_app.py"
    category: "static"
    working_dir: "."
    long_running: false
    purpose: "Check Streamlit Web UI syntax/import validity."
    evidence: "validated local smoke checks"
  -
    name: "web_dev"
    command: ".venv/bin/streamlit run web_app.py"
    category: "dev"
    working_dir: "."
    long_running: true
    purpose: "Launch the local Streamlit Web UI."
    evidence: "README.md and WEB_DEMO.md"
  -
    name: "web_smoke"
    command: "curl --fail --silent --show-error http://localhost:8501/_stcore/health"
    category: "runtime"
    working_dir: "."
    long_running: false
    purpose: "Check that the running Streamlit service reports healthy; this is runtime evidence, not interaction evidence."
    evidence: "2026-07-14 audit-findings-remediation runtime verification"

frontend:
  kind: "streamlit"
  primary_entry: "web_app.py"
  dev_server_url: "http://localhost:8501"
  electron_command: ""
  healthcheck:
    type: "url"
    target: "http://localhost:8501"
  viewports:
    -
      name: "desktop_demo"
      width: 1440
      height: 1000
      device_scale_factor: 1
      zoom_factor: 1
  fallback_viewports:
    -
      name: "laptop"
      width: 1366
      height: 768
      device_scale_factor: 1
      zoom_factor: 1
    -
      name: "narrow"
      width: 390
      height: 844
      device_scale_factor: 2
      zoom_factor: 1

mcp_playwright:
  required_for_ui: true
  availability: "standalone_playwright_verified_in_current_venv"
  preferred_plugin_status: "blocked: Browser and Chrome clients fail with Cannot redefine property: process"
  fallback_policy: "Use real Playwright/browser interaction with snapshot, console, network and screenshot evidence; curl-only checks prove service reachability but not interaction behavior."
  last_evidence: ".harness/tasks/2026-07-14/fix/audit-findings-remediation/logs/interaction-summary.json"

unresolved:
  - "Browser and Chrome plugin clients currently fail during runtime initialization; standalone Playwright is test-only and is not listed as a production dependency."
  - "Chinese OCR language data is installed locally; screenshot clarity and OCR spacing artifacts still require validation for real user images."

rules:
  unknown_policy: "运行、调试、入口 URL、测试数据或 MCP Playwright 可用性无法确认时，任务必须进入 needs_clarification。"
  frontend_behavior_gate: "Streamlit 前端或用户可见行为变更必须有 runtime-test-plan.md 和 interaction-test-plan.yaml，不能只以 build/typecheck/lint/compile 作为完成依据。"
  evidence_policy: "Playwright/浏览器验证必须记录 snapshot、console、network、screenshot 和 validations.json.interaction_checks。"
